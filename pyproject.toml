[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "f1tv-dl"
version = "1.6.1"
description = "An F1 TV desktop and command-line client for local playback and downloads"
readme = "README.md"
requires-python = ">=3.10"
license = "ISC"
license-files = ["LICENSE"]
authors = [{name = "f1tv-dl contributors"}]
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]
dev = ["ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
f1tv-dl = "f1tv_dl.cli:main"

[project.gui-scripts]
f1tv-dl-gui = "f1tv_dl.gui:main"

[tool.setuptools.packages.find]
include = ["f1tv_dl*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
